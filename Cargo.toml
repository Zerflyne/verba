[workspace]
resolver = "2"
members = ["crates/verba-core", "crates/verba-cli", "crates/verba-app"]

# `verba-app` non e' fra i membri predefiniti: tirarsi dietro GTK, WebKit e
# D-Bus per compilare la riga di comando sarebbe un pedaggio ingiustificato, e
# su una macchina senza quelle librerie `cargo build` fallirebbe anche a chi
# della finestra non sa che farsene. L'applicazione si compila chiedendola:
#
#     cargo build -p verba-app --release
default-members = ["crates/verba-core", "crates/verba-cli"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/zerflyne/verba"
authors = ["zerflyne"]

[workspace.dependencies]
verba-core = { path = "crates/verba-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4.0"
ctrlc = "3.5"

# audio: decodifica multi-formato in RAM + ricampionamento
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"

# inferenza ONNX (pyannote + wav2vec2)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.16"

# whisper.cpp (large-v3, GGML/GGUF)
whisper-rs = "=0.14.2"

# scaricamento dei modelli: HTTP con ripresa e verifica dell'hash
ureq = "2.12"
sha2 = "0.10"

# interrogazione VRAM
nvml-wrapper = "0.10"

# misura e disegno del testo
cosmic-text = { version = "0.14.2", default-features = false, features = ["std", "swash"] }

cc = "1.4.5"
pkg-config = "0.3.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
