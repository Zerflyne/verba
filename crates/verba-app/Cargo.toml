[package]
name = "verba-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Verba — sottotitoli automatici in locale, applicazione desktop"

# Il binario si chiama `verba-app` per non confondersi con la riga di comando,
# che si chiama `verba`.
[[bin]]
name = "verba-app"
path = "src/main.rs"

# Solo `lib`: `cdylib` e `staticlib` servono al guscio Android e a quello iOS,
# che qui non esistono — i bersagli del bundle sono deb, AppImage e nsis. Con
# tutti e tre, ogni compilazione produceva 1,26 GB di archivi che nessuno
# apriva mai.
[lib]
name = "verba_app"
crate-type = ["lib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
verba-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
