# Su un tag `v*`: i tre pacchetti della spec, allegati a una release in bozza.
#
#   .deb        Debian e Ubuntu
#   .AppImage   le altre distribuzioni
#   .exe        installer per Windows
#   .dmg        macOS (Apple silicon)
#
# ONNX Runtime non e' impacchettabile dentro l'eseguibile e non si puo' dare
# per scontata sulla macchina di chi installa: viene scaricata qui e messa in
# `crates/verba-app/lib`, che `tauri.conf.json` dichiara come risorsa. La
# versione e' vincolata: `ort 2.0.0-rc.10` legge `GetVersionString` all'avvio e
# accetta solo la 1.22.x.
#
# I modelli invece **non** vengono impacchettati: sono quasi tre gigabyte, e li
# scarica l'applicazione al primo avvio.

name: Rilascio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ORT_VERSIONE: "1.22.0"
  # whisper.cpp usa `std::filesystem::directory_iterator`, disponibile dal
  # 10.15. Senza questa riga il target predefinito e' piu' vecchio e il
  # compilatore rifiuta l'intestazione. 11.0 e' comunque il minimo su
  # Apple silicon, dove il pacchetto viene costruito.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  pacchetti:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: ubuntu-24.04
            nome: linux
            bundle: deb,appimage
          - sistema: windows-latest
            nome: windows
            bundle: nsis
          - sistema: macos-latest
            nome: macos
            bundle: dmg

    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}

    steps:
      - uses: actions/checkout@v5

      - name: Librerie di sistema (Linux)
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev patchelf

      - name: FFmpeg (macOS)
        if: matrix.nome == 'macos'
        run: |
          # `cmake-rs` non imposta CMAKE_OSX_DEPLOYMENT_TARGET, quindi
          # MACOSX_DEPLOYMENT_TARGET da solo non arriva fino a clang. I flag
          # invece vengono inoltrati come CMAKE_C_FLAGS e CMAKE_CXX_FLAGS.
          echo "CFLAGS=-mmacosx-version-min=11.0" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-mmacosx-version-min=11.0" >> "$GITHUB_ENV"
          # I flag da soli non bastano: CMake aggiunge il proprio
          # `-mmacosx-version-min` dopo i CMAKE_CXX_FLAGS, e vince l'ultimo.
          # `cmake-rs` non permette di passare define, ma legge
          # CMAKE_TOOLCHAIN_FILE dall'ambiente — e un file di toolchain viene
          # letto prima di qualsiasi CMakeLists.
          echo 'set(CMAKE_OSX_DEPLOYMENT_TARGET "11.0" CACHE STRING "" FORCE)' \
            > "$RUNNER_TEMP/minimo.cmake"
          echo "CMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/minimo.cmake" >> "$GITHUB_ENV"
          brew install ffmpeg pkg-config
          # `ffmpeg` di Homebrew installa anche gli header e i .pc: al
          # `build.rs` basta che pkg-config sappia dove guardare.
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: FFmpeg (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          # Le build di gyan.dev contengono include/ e lib/ gia' pronti: il
          # `build.rs` li trova con FFMPEG_INCLUDE_DIR e FFMPEG_LIB_DIR, senza
          # bisogno di pkg-config.
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          curl.exe -L $url -o ffmpeg.7z
          7z x ffmpeg.7z -offmpeg
          $dir = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_INCLUDE_DIR=$dir\include" >> $env:GITHUB_ENV
          echo "FFMPEG_LIB_DIR=$dir\lib" >> $env:GITHUB_ENV
          echo "$dir\bin" >> $env:GITHUB_PATH
          # Sul runner bastava il PATH, perche' il PATH lo si controlla. Su una
          # macchina pulita no: FFmpeg e' legato in modo implicito, quindi a
          # risolverlo e' il caricatore di Windows prima che il programma
          # parta, e guarda la cartella del .exe. Le DLL devono viaggiare
          # dentro il pacchetto, accanto all'eseguibile.
          New-Item -ItemType Directory -Force crates/verba-app/ffmpeg | Out-Null
          Copy-Item "$dir\bin\av*.dll","$dir\bin\sw*.dll","$dir\bin\postproc*.dll" crates/verba-app/ffmpeg/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      # L'interfaccia si compila qui, con un passo suo. `tauri build` la
      # ricompilerebbe comunque dal suo hook, ma un fallimento dentro l'hook
      # arriva come «tauri ... exit code 1» e non dice altro: i log di Actions
      # non si leggono senza account, il nome del passo si'.
      - run: npm run build --prefix ui

      - name: ONNX Runtime (Linux)
        if: matrix.nome == 'linux'
        run: |
          V="$ORT_VERSIONE"
          curl -L -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-linux-x64-$V.tgz"
          tar xf ort.tgz
          mkdir -p crates/verba-app/lib
          cp onnxruntime-linux-x64-$V/lib/libonnxruntime.so* crates/verba-app/lib/

      - name: ONNX Runtime (macOS)
        if: matrix.nome == 'macos'
        run: |
          V="$ORT_VERSIONE"
          curl -L -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-osx-arm64-$V.tgz"
          tar xf ort.tgz
          mkdir -p crates/verba-app/lib
          cp onnxruntime-osx-arm64-$V/lib/libonnxruntime*.dylib crates/verba-app/lib/

      - name: ONNX Runtime (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          $V = $env:ORT_VERSIONE
          curl.exe -L -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$V/onnxruntime-win-x64-$V.zip"
          Expand-Archive ort.zip -DestinationPath ort
          New-Item -ItemType Directory -Force crates/verba-app/lib | Out-Null
          Copy-Item "ort/onnxruntime-win-x64-$V/lib/onnxruntime.dll" crates/verba-app/lib/

      # `tauri-action` fa la stessa cosa, ma quando fallisce dice soltanto
      # «tauri [...] exit code 1»: l'errore vero resta nei log, e i log di
      # Actions non si leggono senza un account. Qui la CLI viene invocata
      # direttamente e, se cade, le ultime righe finiscono in
      # un'annotazione — che invece e' pubblica.
      - name: Pacchetti
        shell: bash
        working-directory: crates/verba-app
        run: |
          npm install -g @tauri-apps/cli@^2
          set -o pipefail
          if ! tauri build --bundles ${{ matrix.bundle }} 2>&1 | tee /tmp/tauri.log; then
            versione=$(grep -o -m3 'mmacosx-version-min=[0-9.]*' /tmp/tauri.log | sort -u | tr '\n' ' ')
            echo "::notice::minimo macOS in linea: ${versione:-nessuno}"
            # La coda secca non basta: su Windows le ultime righe sono il dump
            # del PATH, e l'errore vero sta molto piu' su. Si tengono le righe
            # che parlano di errore, e la coda solo come riserva.
            estratto=$(grep -a -E -i 'error|errore|fatal|panick|cannot |no such |not found|LINK :|LNK[0-9]' /tmp/tauri.log \
              | grep -a -v -E 'rerun-if-env-changed|_ERROR=|CC_ENABLE|NO_DEFAULTS' \
              | tail -n 35)
            [ -z "$estratto" ] && estratto=$(tail -n 25 /tmp/tauri.log)
            testo=$(printf '%s\n' "$estratto" \
              | cut -c1-400 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=tauri build (${{ matrix.nome }})::$testo"
            # Il riepilogo del job e' pubblico come le annotazioni, ma non ha
            # limiti di lunghezza ne' problemi di caratteri da proteggere:
            # quando l'annotazione non basta, l'errore si legge qui.
            {
              echo "## ${{ matrix.nome }} — tauri build non riuscito"
              echo
              echo '### Righe che parlano di errore'
              echo '```'
              printf '%s\n' "$estratto"
              echo '```'
              echo '### Ultime 120 righe'
              echo '```'
              tail -n 120 /tmp/tauri.log | cut -c1-300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Sperare che le librerie siano nel pacchetto e' esattamente cio' che ci
      # ha gia' fatto pubblicare un installer che non si apriva. Qui il
      # pacchetto prodotto viene aperto e ispezionato: se manca qualcosa, il
      # lavoro cade su una macchina che ha la piattaforma giusta, non a casa di
      # chi installa.
      - name: Le librerie native sono dentro l'installer (Windows)
        if: matrix.nome == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "nessun installer in target/release/bundle/nsis" }

          # `-slt` stampa un `Path = ...` per file: si legge senza indovinare
          # dove cadono le colonne.
          $percorsi = @(& 7z l -slt $setup.FullName |
            Where-Object { $_ -like 'Path = *' } |
            ForEach-Object { ($_ -replace '^Path = ', '').Trim() })

          # Se 7z non sa aprire il formato non si deve concludere che le
          # librerie manchino: sarebbe la diagnosi sbagliata sul sintomo
          # giusto.
          if ($percorsi.Count -lt 2) {
            throw "7z non ha elencato niente dentro $($setup.Name): la verifica non ha potuto girare."
          }

          $attese = @('avcodec-61.dll', 'avformat-61.dll', 'avutil-59.dll',
                      'swresample-5.dll', 'onnxruntime.dll')
          $nomi = $percorsi | ForEach-Object { Split-Path $_ -Leaf }
          $mancanti = @($attese | Where-Object { $nomi -notcontains $_ })

          # Il contenuto finisce sempre nel riepilogo: dove stanno le DLL
          # decide se il programma si apre, e volerlo sapere solo quando si
          # rompe qualcosa e' il motivo per cui si rompe.
          $righe = @('## windows - dentro ' + $setup.Name, '', '```')
          $righe += ($percorsi | Sort-Object)
          $righe += '```'
          if ($mancanti) {
            $righe = @('## windows - librerie mancanti nell''installer', '',
                       'Mancano: ' + ($mancanti -join ', '), '') + $righe[1..($righe.Count - 1)]
          }
          $righe | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

          if ($mancanti) {
            echo "::error title=librerie mancanti nell'installer::$($mancanti -join ', ')"
            exit 1
          }
          echo "Nell'installer ci sono tutte le librerie native."

      # Su Windows la CLI si compila ma non si allega: da sola non
      # partirebbe comunque, perche' le DLL di FFmpeg stanno dentro
      # l'installer. Si continua a compilarla perche' MSVC ha gia'
      # rifiutato codice che gcc e clang accettavano.
      - name: Riga di comando
        run: cargo build --release -p verba-cli

      - uses: actions/upload-artifact@v4
        with:
          name: verba-${{ matrix.nome }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/verba
          if-no-files-found: warn

  release:
    name: Bozza di release
    needs: pacchetti
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti

      - name: Crea la bozza
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: pacchetti/**/*
          body: |
            Vedi il [diario delle versioni](CHANGELOG.md).

            **Il primo avvio scarica quasi 3 GB di modelli.** Non stanno dentro
            l'eseguibile e non ci possono stare.

            L'installer di Windows non e' firmato e l'app di macOS non e'
            notarizzata: SmartScreen e Gatekeeper possono mostrare un avviso.
            Il README spiega come procedere in entrambi i casi.

            L'installer di Windows si porta dietro FFmpeg (build *shared* di
            [gyan.dev](https://github.com/GyanD/codexffmpeg), GPL-3). Verba
            resta MIT, compatibile con la GPL, ma quel pacchetto nel suo
            insieme si distribuisce alle condizioni della GPL.

            **Il pacchetto macOS non imbarca FFmpeg**: su una macchina che non
            ce l'ha non si apre. Nessuno l'ha ancora provato.
