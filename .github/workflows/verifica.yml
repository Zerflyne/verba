# Su ogni push e su ogni pull request: test, clippy e build dell'interfaccia.
#
# Non compila l'applicazione Tauri: quella ha bisogno di GTK e WebKit, e
# tenerli nella verifica di ogni commit costa qualche minuto a ogni giro senza
# aggiungere granche' — il guscio e' sottile, e cio' che c'e' dentro e' gia'
# coperto dai test di verba-core. Il rilascio invece la compila davvero.

name: Verifica

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  motore:
    name: Motore e riga di comando
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `--exclude verba-app` non e' pignoleria: `--workspace` ignora i
      # `default-members` e si tira dietro anche il guscio Tauri, che qui non
      # compila perche' GTK e WebKit non ci sono. L'esclusione dev'essere
      # scritta, altrimenti il comando contraddice il commento in cima al file.
      - name: Test
        run: cargo test --workspace --exclude verba-app

      - name: Clippy
        run: cargo clippy --workspace --exclude verba-app --all-targets -- -D warnings

  interfaccia:
    name: Interfaccia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      # `npm run build` fa anche `tsc --noEmit`: i tipi del ponte verso il
      # motore sono scritti a mano, e un campo rinominato in Rust si vede solo
      # qui.
      - run: npm run build --prefix ui
